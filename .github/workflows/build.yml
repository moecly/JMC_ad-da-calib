name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BOARDS: AD_4CH DA_4CH
  ROLES: APP REF DUT MANUAL
  BUILD_TYPES: Debug Release

jobs:
  # 先建草稿 Release；构建产物直接传 Release，不占 Actions artifact 存储
  prepare:
    name: prepare release
    runs-on: ubuntu-latest
    steps:
      - name: Reset draft release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          gh release delete "${tag}" --yes || true
          gh release create "${tag}" --draft --title "${tag}" --generate-notes

  # 固件是交叉编译产物，与构建主机平台无关：单平台构建一次，出一个 zip
  firmware:
    name: firmware
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Ensure Ninja
        run: |
          command -v ninja >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y ninja-build
          }
          ninja --version

      - name: Configure & build all boards x roles x build types
        run: |
          set -euo pipefail
          for b in ${BOARDS}; do
            for r in ${ROLES}; do
              for t in ${BUILD_TYPES}; do
                dir="build/${b}-${r}-${t}"
                echo "::group::${b} ${r} ${t}"
                cmake -DBOARD="${b}" -DCALIB_ROLE="${r}" -DBUILD_TYPE="${t}" \
                      -DCMAKE_TOOLCHAIN_FILE=cmake/gcc.cmake -G Ninja -B "${dir}"
                cmake --build "${dir}"
                echo "::endgroup::"
              done
            done
          done

      - name: Package firmware zip
        run: |
          set -euo pipefail
          major=$(sed -n 's/^set(MAJOR \([0-9]\+\))/\1/p' CMakeLists.txt)
          minor=$(sed -n 's/^set(MINOR \([0-9]\+\))/\1/p' CMakeLists.txt)
          ver="v${major}.${minor}"
          mkdir -p dist
          find build -maxdepth 3 -type f \
            \( -name '*.elf' -o -name '*.hex' -o -name '*.map' \) \
            -exec cp {} dist/ \;
          ls -l dist
          (cd dist && zip -r "../firmware-${ver}.zip" .)
          sha256sum "firmware-${ver}.zip" > "firmware-${ver}.zip.sha256"
          ls -l firmware-*.zip*

      - name: Upload firmware assets to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release upload "${GITHUB_REF_NAME}" firmware-*.zip firmware-*.zip.sha256 --clobber

  # 桌面上位机是原生程序，按平台各出一套安装包
  desktop:
    name: desktop (${{ matrix.os }} / ${{ matrix.app }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        app: [host, prod]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libudev-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.app }}/src-tauri

      # probe-rs 走 nusb（纯 Rust），无需 libusb；hidapi 在 Linux 需要 libudev（已装）
      - name: Install frontend dependencies
        working-directory: ${{ matrix.app }}
        run: npm ci

      - name: Build Tauri bundles
        working-directory: ${{ matrix.app }}
        run: npm run tauri build

      - name: List bundles
        shell: bash
        working-directory: ${{ matrix.app }}/src-tauri/target/release/bundle
        run: find . -maxdepth 2 -type f | sort

      - name: Upload desktop bundles to release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        working-directory: ${{ matrix.app }}/src-tauri/target/release/bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(*/*.deb */*.rpm */*.AppImage */*.dmg */*.msi */*-setup.exe)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no desktop bundles found" >&2
            exit 1
          fi
          gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [prepare, firmware, desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false --latest
