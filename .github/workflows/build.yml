name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  BOARDS: AD_4CH DA_4CH
  ROLES: APP REF DUT MANUAL
  BUILD_TYPES: Debug Release

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Arm GNU Toolchain (arm-none-eabi-gcc)
        uses: carlosperate/arm-none-eabi-gcc-action@v1
        with:
          release: '14.2.Rel1'

      - name: Ensure Ninja
        shell: bash
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            case "${RUNNER_OS}" in
              Linux)   sudo apt-get update && sudo apt-get install -y ninja-build ;;
              macOS)   brew install ninja ;;
              Windows) choco install ninja -y --no-progress ;;
            esac
          fi
          ninja --version
          cmake --version

      - name: Configure & build all boards x roles x build types
        shell: bash
        run: |
          set -euo pipefail
          for b in ${BOARDS}; do
            for r in ${ROLES}; do
              for t in ${BUILD_TYPES}; do
                dir="build/${b}-${r}-${t}"
                echo "::group::${b} ${r} ${t}"
                cmake -DBOARD="${b}" -DCALIB_ROLE="${r}" -DBUILD_TYPE="${t}" \
                      -DCMAKE_TOOLCHAIN_FILE=cmake/gcc.cmake -G Ninja -B "${dir}"
                cmake --build "${dir}"
                echo "::endgroup::"
              done
            done
          done

      - name: Collect artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find build -maxdepth 3 -type f \
            \( -name '*.elf' -o -name '*.hex' -o -name '*.map' \) \
            -exec cp {} dist/ \;
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package per-OS archives
        shell: bash
        run: |
          set -euo pipefail
          major=$(sed -n 's/^set(MAJOR \([0-9]\+\))/\1/p' CMakeLists.txt)
          minor=$(sed -n 's/^set(MINOR \([0-9]\+\))/\1/p' CMakeLists.txt)
          ver="v${major}.${minor}"
          echo "version=${ver}"
          mkdir -p out
          for d in artifacts/firmware-*; do
            os="${d#artifacts/firmware-}"
            (cd "$d" && zip -r "../../out/firmware-${ver}-${os}.zip" .)
          done
          ls -l out

      - uses: softprops/action-gh-release@v2
        with:
          files: out/*.zip
